server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing - let React Router handle client-side paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container/service
    location /api/ {
        proxy_pass https://a-e-tech-project.onrender.com/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /uploads/ {
        proxy_pass https://a-e-tech-project.onrender.com/uploads/;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
